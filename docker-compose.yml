services:
  postgres:
    image: postgres:17
    container_name: tenniscrm-db

    environment:
      POSTGRES_DB: tenniscrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresPASS

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tenniscrm-frontend

    ports:
      - "5173:80"

    depends_on:
      - api

    restart: unless-stopped

  api:
    build: ./backend
    container_name: tenniscrm-api

    ports:
      - "8080"

    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=tenniscrm;Username=postgres;Password=postgresPASS"

    depends_on:
      - postgres

    restart: unless-stopped

volumes:
  postgres-data: